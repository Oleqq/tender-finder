name: tender-finder

x-application: &application
  build:
    context: .
  env_file:
    - .env.production
  restart: unless-stopped
  init: true

services:
  web:
    <<: *application
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080", "--no-reload"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  queue:
    <<: *application
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *application
    command: ["php", "artisan", "schedule:work"]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  migrate:
    <<: *application
    profiles: ["ops"]
    restart: "no"
    command: ["php", "artisan", "migrate", "--force"]

volumes:
  caddy_data:
  caddy_config:
